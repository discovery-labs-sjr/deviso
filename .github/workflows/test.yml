name: test

on:
  push:
    branches:
      - main
      - feat/premium-modern-ui
  pull_request:

jobs:
  python-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pytest
      - run: python -m compileall -q app.py deviso_core.py
      - run: pytest -q
